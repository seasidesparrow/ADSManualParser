[project]
name = "adsmanparse"
version = "0.9.0"
description = "ADS Classic data ingest preparation library"
authors = [
    { name = "Matthew Templeton", email = "matthew.templeton@cfa.harvard.edu"}
]
license = { text = "MIT" }
readme = "README.md"
repository = "https://github.com/adsabs/ADSManualParser"
documentation = "https://adsmanparse.readthedocs.io"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
packages = [
    "adsmanparse",
]

dependencies = [
    'adsingestp @ git+https://github.com/adsabs/ADSIngestParser.git@v0.9.45',
    'adsenrich @ git+https://github.com/adsabs/ADSIngestEnrichment.git@v0.9.31',
    'click>=8.0.3',
    'beautifulsoup4==4.10.0',
    'lxml==4.7.1',
    'nameparser==1.1.3',
    'ordered-set==4.1.0',
    'python-dateutil==2.8.1',
    'validators==0.22.0',
]


[project.urls]
Source = "https://github.com/adsabs/ADSManualParser"
Documentation = "https://adsmanparse.readthedocs.io"


[project.optional-dependencies]
dev = [
    'black==23.1.0',
    'flake8==5.0.4',
    'isort==5.12.0',
    'pytest==6.2.5',
    'pyupgrade==2.29.1',
    'pytest-mock==3.6.1',
    'pre-commit==2.16.0',
    'coveralls==3.3.1',
    'mock==4.0.3',
    'coverage==6.2',
    'pytest-cov==3.0.0',
    'pytest-cookies==0.6.1',
    'semantic-release==0.1.0',
]
docs = [
    'Sphinx==7.2.6',
    'myst-parser==2.0.0',
    'sphinx-rtd-theme==2.0.0'
]


[tool.semantic_release]
branch = "main"
version_toml = "pyproject.toml:project.version"
version_variable = "adsmanparse/version.py:__version__"
build_command = "flit build"

[tool.pytest.ini_options]
addopts = "-v -Wdefault --cov=adsmanparse"
cache_dir = ".tmp/"

[tool.coverage.run]
data_file = ".tmp/.coverage"

[tool.coverage.report]
skip_empty = true
skip_covered = true

[tool.isort]
profile = "black"
known_first_party = ["adsmanparse", "tests"]

[tool.black]
line-length = 99 # override black's default line-length

[build-system]
requires = ["setuptools==60.10.0", "wheel", "flit_core >=3.2,<4", "ppsetuptools==2.0.2"]
build-backend = "flit_core.buildapi"
#build-backend = "setuptools.build_meta"

# see setup.py for explanation of these
[xsetup.entry_points]
console_scripts = [
    "adsmanparse=adsmanparse.cli:cli",
]
[xsetup]
scripts = [
]

